<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">zcrudp codec benchmark</title><desc id="desc">Median amortized cost and throughput; one operation on the final row decodes sixteen records.</desc>
<rect width="1000" height="570" fill="#f8fafc"/><g font-family="monospace" fill="#0f172a">
<text x="25" y="32" font-size="22">zcrudp: in-memory codecs (not network latency)</text>
<text x="25" y="57" font-size="13">7 batches x 1000000 operations; median; warm cache; CLOCK_MONOTONIC</text>
<text x="25" y="95" font-size="16">Amortized cost: ns/operation (lower is better)</text>
<text x="25" y="129" font-size="13">frame_encode_8B</text><rect x="300" y="113" width="61.50" height="22" fill="#2563eb"/><text x="371.50" y="129" font-size="13">1.59</text>
<text x="25" y="164" font-size="13">frame_decode_8B</text><rect x="300" y="148" width="238.34" height="22" fill="#2563eb"/><text x="548.34" y="164" font-size="13">6.17</text>
<text x="25" y="199" font-size="13">record_encode_8B</text><rect x="300" y="183" width="56.29" height="22" fill="#2563eb"/><text x="366.29" y="199" font-size="13">1.46</text>
<text x="25" y="234" font-size="13">record_decode_8B</text><rect x="300" y="218" width="232.63" height="22" fill="#2563eb"/><text x="542.63" y="234" font-size="13">6.02</text>
<text x="25" y="269" font-size="13">datagram_decode_16_records</text><rect x="300" y="253" width="500.00" height="22" fill="#2563eb"/><text x="810.00" y="269" font-size="13">12.95</text>
<text x="25" y="320" font-size="16">Throughput: million operations/s (higher is better)</text>
<text x="25" y="354" font-size="13">frame_encode_8B</text><rect x="300" y="338" width="457.68" height="22" fill="#0f766e"/><text x="767.68" y="354" font-size="13">628.07</text>
<text x="25" y="389" font-size="13">frame_decode_8B</text><rect x="300" y="373" width="118.09" height="22" fill="#0f766e"/><text x="428.09" y="389" font-size="13">162.05</text>
<text x="25" y="424" font-size="13">record_encode_8B</text><rect x="300" y="408" width="500.00" height="22" fill="#0f766e"/><text x="810.00" y="424" font-size="13">686.14</text>
<text x="25" y="459" font-size="13">record_decode_8B</text><rect x="300" y="443" width="120.99" height="22" fill="#0f766e"/><text x="430.99" y="459" font-size="13">166.03</text>
<text x="25" y="494" font-size="13">datagram_decode_16_records</text><rect x="300" y="478" width="56.29" height="22" fill="#0f766e"/><text x="366.29" y="494" font-size="13">77.25</text>
<text x="25" y="550" font-size="12">One operation = one 8B frame/record, or one 132B datagram (16 records) on the last row.</text></g></svg>
