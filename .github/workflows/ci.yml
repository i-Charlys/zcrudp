name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up GCC & Build Tools
      run: sudo apt-get update && sudo apt-get install -y gcc make

    - name: Compile and Run Standard Tests
      run: make clean && make test

    - name: Run Memory Sanitizers (ASan & UBSan)
      run: make clean && make asan
