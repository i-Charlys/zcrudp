name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up GCC & Build Tools
      run: sudo apt-get update && sudo apt-get install -y gcc make

    - name: Compile and Run Standard Tests
      run: make clean && make test

    - name: Run Memory Sanitizers (ASan & UBSan)
      run: make clean && make asan

    - name: Test POSIX demo and benchmark reports
      run: make test-tools

    - name: Compare engines and enforce paced-loss recovery regression
      run: make test-compare

    - name: Test CMake package and embedded consumers
      run: make test-cmake

    - name: Verify deterministic visual-demo trace
      run: python3 bench/render_visual.py --output build/visual-smoke

    - name: Test CMake shared libraries in Release mode
      run: |
        cmake -S . -B build/cmake-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DZCRUDP_WARNINGS_AS_ERRORS=ON
        cmake --build build/cmake-shared --parallel 2
        ctest --test-dir build/cmake-shared --output-on-failure
